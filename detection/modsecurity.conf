# php2shell-guard — ModSecurity (v2/v3) rules for CVE-2026-109618 / CVE-2026-109619
#
# Drop-in for Apache (mod_security2) or Nginx (libmodsecurity3 + connector).
# Blocks the primary php2shell vector: PHP_SESSION_UPLOAD_PROGRESS in a request
# body. This is the fastest edge mitigation while you patch — the field has
# near-zero legitimate use.
#
# Rule ID range 9109600-9109699 is in the local/user range. Adjust if it clashes.
# Requires request-body access enabled:
#   SecRequestBodyAccess On
#
# Start in DetectionOnly (SecRuleEngine DetectionOnly) and watch your logs before
# switching to blocking. NOTE: this reduces the session/upload vector only — it
# does NOT close the Zend-core OOM path (CVE-2026-109618). Patch PHP.

# --- 1. Block upload_progress field anywhere in the request body ---
SecRule REQUEST_BODY|REQUEST_HEADERS|ARGS_NAMES "@contains PHP_SESSION_UPLOAD_PROGRESS" \
    "id:9109600,\
    phase:2,\
    t:none,\
    deny,\
    status:403,\
    log,\
    msg:'php2shell: PHP_SESSION_UPLOAD_PROGRESS blocked (CVE-2026-109618/19)',\
    tag:'cve/2026-109618',\
    tag:'cve/2026-109619',\
    severity:'CRITICAL'"

# --- 2. Tighten: multipart POST specifically carrying the field ---
SecRule REQUEST_METHOD "@streq POST" \
    "id:9109601,\
    phase:2,\
    t:none,\
    chain,\
    deny,\
    status:403,\
    log,\
    msg:'php2shell: multipart upload_progress abuse',\
    tag:'cve/2026-109618',\
    severity:'CRITICAL'"
    SecRule REQUEST_HEADERS:Content-Type "@contains multipart/form-data" \
        "chain,t:lowercase"
        SecRule REQUEST_BODY "@contains PHP_SESSION_UPLOAD_PROGRESS" "t:none"

# --- 3. Flag likely webshell interaction (log only; tune before blocking) ---
SecRule ARGS_NAMES "@rx ^(cmd|exec|shell|system|c)$" \
    "id:9109602,\
    phase:2,\
    t:lowercase,\
    pass,\
    log,\
    msg:'php2shell: possible webshell parameter observed',\
    tag:'cve/2026-109618',\
    severity:'WARNING'"
